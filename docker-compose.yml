version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus_chain_vote_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campus_vote}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_vote"]
      interval: 5s
      timeout: 5s
      retries: 5

  hardhat-node:
    build:
      context: .
      dockerfile: Dockerfile.hardhat
    container_name: campus_chain_vote_hardhat
    restart: unless-stopped
    ports:
      - "8545:8545"
    depends_on:
      - postgres

volumes:
  postgres_data:
